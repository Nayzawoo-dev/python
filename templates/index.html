<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌈 Kids Game Launcher 🌈</title>
    <!-- Google Fonts: friendly rounded font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Comic+Neue:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(
          145deg,
          #4facfe 0%,
          #00f2fe 40%,
          #43e97b 100%
        );
        /* bright sky to grass gradient - neutral and fun */
        font-family: "Baloo 2", "Comic Neue", cursive, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start; /* changed to allow navbar at top */
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      /* playful shapes (replacing clouds with more diverse objects) */
      .shape {
        position: absolute;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
      }

      .shape1 {
        top: 10px;
        left: 5%;
        width: 150px;
        height: 150px;
        background: rgba(255, 215, 0, 0.2);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }

      .shape2 {
        bottom: 20px;
        right: 3%;
        width: 200px;
        height: 200px;
        background: rgba(255, 99, 71, 0.15);
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }

      .shape3 {
        top: 40%;
        left: 80%;
        width: 100px;
        height: 100px;
        background: rgba(50, 205, 50, 0.2);
        border-radius: 30% 70% 50% 50% / 30% 40% 60% 70%;
      }

      /* new navbar style */
      .navbar {
        background-color: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 60px;
        padding: 10px 30px;
        margin-bottom: 30px;
        width: fit-content;
        max-width: 90%;
        border: 4px solid white;
        box-shadow:
          0 10px 0 #ffb347,
          0 10px 20px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 15px 30px;
        z-index: 20;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.8rem;
        font-weight: 600;
        color: #2d4b2d;
        text-decoration: none;
        transition: transform 0.2s;
        cursor: default; /* non-interactive demo */
      }

      .nav-item i {
        font-size: 2.2rem;
        color: #ff8c42;
        filter: drop-shadow(2px 2px 0 #fff6b0);
      }

      .nav-item:hover {
        transform: translateY(-3px);
      }

      /* main card */
      .launcher-card {
        background-color: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 60px 60px 40px 40px;
        box-shadow:
          0 25px 40px rgba(0, 0, 0, 0.2),
          0 10px 15px rgba(0, 0, 0, 0.1),
          inset 0 2px 5px rgba(255, 255, 255, 0.8);
        padding: 40px 30px;
        max-width: 900px;
        width: 100%;
        border: 4px solid white;
        position: relative;
        z-index: 10;
      }

      h1 {
        font-size: 4rem;
        font-weight: 700;
        color: #1f4f2b;
        text-shadow:
          5px 5px 0 #f9d71c,
          8px 8px 0 rgba(50, 150, 255, 0.4);
        margin-top: 0;
        margin-bottom: 10px;
        letter-spacing: 2px;
        word-break: break-word;
      }

      .sub-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        font-size: 1.8rem;
        color: #1f3a3a;
        background: #f9e57c;
        padding: 12px 25px;
        border-radius: 60px;
        margin: 15px auto 35px auto;
        width: fit-content;
        border: 3px solid white;
        box-shadow: 0 5px 0 #d49b3b;
      }

      .sub-header i {
        color: #2e8b57;
        font-size: 2.2rem;
        filter: drop-shadow(2px 2px 0 #ffd966);
      }

      /* game grid */
      .game-grid {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 30px 0 20px;
      }

      /* game button style – bold and bouncy */
      .game-btn {
        background: linear-gradient(145deg, #ffcf7a, #ffb347);
        border: 4px solid white;
        border-radius: 50px;
        padding: 20px 30px;
        min-width: 200px;
        font-size: 2rem;
        font-weight: 700;
        font-family: "Baloo 2", cursive;
        color: #2d1f00;
        text-shadow: 2px 2px 0 #ffe69b;
        box-shadow:
          0 12px 0 #b1640e,
          0 10px 20px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        transition: all 0.1s ease-out;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        line-height: 1;
        flex: 0 1 auto;
        transform: translateY(0);
        outline: none;
      }

      .game-btn i {
        font-size: 2.5rem;
        color: #fff2b5;
        filter: drop-shadow(0 4px 2px #b1640e);
      }

      .game-btn:hover {
        background: linear-gradient(145deg, #ffe29c, #ffc764);
        transform: translateY(-5px);
        box-shadow:
          0 17px 0 #b1640e,
          0 15px 25px rgba(0, 0, 0, 0.25);
      }

      .game-btn:active {
        transform: translateY(8px);
        box-shadow:
          0 6px 0 #b1640e,
          0 8px 15px rgba(0, 0, 0, 0.2);
        transition: 0.05s;
      }

      /* color variations for game buttons */
      .game-btn:nth-child(4n + 1) {
        background: linear-gradient(145deg, #7dc9ff, #4aa3ff);
        box-shadow: 0 12px 0 #1f6bb0;
      }
      .game-btn:nth-child(4n + 1) i {
        filter: drop-shadow(0 4px 2px #1f6bb0);
      }

      .game-btn:nth-child(4n + 2) {
        background: linear-gradient(145deg, #ff9f7c, #ff7645);
        box-shadow: 0 12px 0 #b1451a;
      }
      .game-btn:nth-child(4n + 2) i {
        filter: drop-shadow(0 4px 2px #b1451a);
      }

      .game-btn:nth-child(4n + 3) {
        background: linear-gradient(145deg, #b78cff, #925bff);
        box-shadow: 0 12px 0 #542ca8;
      }
      .game-btn:nth-child(4n + 3) i {
        filter: drop-shadow(0 4px 2px #542ca8);
      }

      /* 4n+4 is original orange, keep as is. */

      /* footer */
      .footer-note {
        margin-top: 40px;
        font-size: 1.5rem;
        color: #1d4e1d;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 40px;
        padding: 10px 30px;
        display: inline-block;
        border: 3px dashed #ff9f4b;
        backdrop-filter: blur(4px);
      }

      .footer-note i {
        margin: 0 5px;
        color: #ff6347;
      }

      /* responsive */
      @media (max-width: 600px) {
        h1 {
          font-size: 3rem;
        }
        .game-btn {
          font-size: 1.6rem;
          min-width: 160px;
          padding: 15px 20px;
        }
        .game-btn i {
          font-size: 2rem;
        }
        .sub-header {
          font-size: 1.4rem;
        }
        .navbar {
          font-size: 1.4rem;
          padding: 8px 20px;
          gap: 10px;
        }
        .nav-item i {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- floating abstract shapes (replaces clouds for a more neutral look) -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <div class="launcher-card">
      <h1>
        <i class="fas fa-rocket" style="color: #ff8c42"></i>
        GAME LAUNCHER
        <i class="fas fa-dragon" style="color: #3cb371"></i>
      </h1>
      <div class="sub-header">
        <i class="fas fa-pizza-slice"></i>
        <span>choose your adventure!</span>
        <i class="fas fa-robot"></i>
      </div>

      <!-- dynamic game buttons from backend -->
      <div class="game-grid">
        {% for name in games %}
        <button class="game-btn" onclick="launch('{{ name }}')">
          <i class="fas fa-ghost"></i>
          {{ name }}
          <i class="fas fa-cookie-bite"></i>
        </button>
        {% endfor %}
      </div>

      <div class="footer-note">
        <i class="fas fa-thumbs-up"></i> click & play!
        <i class="fas fa-thumbs-up"></i>
      </div>
    </div>

    <script>
      function launch(gameName) {
        const buttons = document.querySelectorAll(".game-btn");
        buttons.forEach((btn) => {
          if (btn.innerText.includes(gameName)) {
            btn.style.transform = "scale(0.95)";
            setTimeout(() => (btn.style.transform = ""), 150);
          }
        });

        fetch("/play/" + encodeURIComponent(gameName))
          .then((response) => {
            if (!response.ok) console.warn("Launch maybe failed?");
          })
          .catch((err) => console.log("fetch error", err));

        const header = document.querySelector(".sub-header span");
        if (header) {
          const originalText = header.innerText;
          header.innerText = "🚀 launching " + gameName + " ...";
          setTimeout(() => (header.innerText = originalText), 1000);
        }
      }
    </script>
  </body>
</html>
